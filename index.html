<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#14141e">
<title>Deutsch Drill</title>
<style>
:root{--ink:#14141e;--inksoft:#1d1d2b;--paper:#f2efe6;--muted:#8b8fa8;--gold:#e0b35a;--line:#2c2c3e;--itcol:#b9bdd4;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:var(--ink);color:var(--paper);font-family:-apple-system,system-ui,sans-serif;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
.serif{font-family:Georgia,'Times New Roman',serif;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
.pill{border-radius:999px;padding:9px 18px;font-size:15px;}
.pill.gold{background:var(--gold);color:var(--ink);font-weight:600;padding:13px 32px;font-size:16px;}
.pill.goldline{border:1px solid var(--gold);color:var(--gold);padding:13px 26px;font-size:16px;}
.pill.dim{border:1px solid var(--line);color:var(--muted);font-size:14px;}
header{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
#screen-home{flex:1;overflow-y:auto;padding:8px 20px 40px;}
.blocktitle{margin:26px 0 10px;display:flex;align-items:baseline;gap:10px;}
.blocktitle .n{font-size:22px;color:var(--gold);}
.blocktitle .c{font-size:12px;color:var(--muted);}
.keyrow{width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;background:var(--inksoft);}
.keyrow .kde{font-size:17px;}
.keyrow .kit{font-size:12.5px;color:var(--muted);margin-top:2px;}
.badge{font-size:11.5px;color:var(--muted);white-space:nowrap;margin-left:10px;}
.badge.rip{color:var(--gold);}
#screen-player{flex:1;display:none;flex-direction:column;}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 26px;gap:16px;}
#stepLabel{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);min-height:14px;}
#stepText{font-size:27px;line-height:1.35;}
#stepText.small{font-size:21px;}
#pausebox{display:none;width:100%;max-width:340px;}
#pausebox .hint{font-size:14px;color:var(--gold);margin-bottom:8px;}
#pbar{height:6px;background:var(--line);border-radius:999px;overflow:hidden;}
#pfill{height:100%;background:var(--gold);border-radius:999px;width:100%;}
#skipbtn{font-size:12px;color:var(--muted);text-decoration:underline;margin-top:10px;}
#dots{display:flex;gap:7px;justify-content:center;padding-bottom:12px;flex-wrap:wrap;max-width:320px;margin:0 auto;}
.dot{width:7px;height:7px;border-radius:50%;background:var(--line);}
.dot.done{background:var(--gold);} .dot.cur{background:var(--paper);}
footer{border-top:1px solid var(--line);padding:14px 20px calc(20px + env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:center;}
#settings{display:none;padding:16px 20px;background:var(--inksoft);border-bottom:1px solid var(--line);font-size:14px;}
#settings .row{margin-bottom:14px;}
#settings label{display:block;color:var(--muted);margin-bottom:5px;}
#settings input[type=range]{width:100%;}
#settings select{width:100%;background:var(--ink);color:var(--paper);border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;}
#settings .val{color:var(--paper);}
#overlay{display:none;position:fixed;inset:0;background:rgba(10,10,16,.94);z-index:50;flex-direction:column;}
#overlay .body{flex:1;overflow-y:auto;padding:34px 26px;max-width:480px;margin:0 auto;width:100%;}
#overlay .parts{font-size:26px;color:var(--gold);margin:6px 0 14px;}
#overlay .parts .plus{color:var(--muted);}
#overlay .pline{font-size:14px;margin-bottom:4px;}
#overlay .pline b{color:var(--gold);font-weight:600;}
#overlay .pline span{color:var(--muted);}
#overlay p{font-size:16px;line-height:1.55;margin-top:16px;}
#overlay p b{color:var(--gold);font-weight:600;}
#overlay .foot{padding:16px 20px calc(22px + env(safe-area-inset-bottom));display:flex;justify-content:center;}
.idleflag{font-size:13.5px;color:var(--muted);max-width:300px;line-height:1.5;}
.bigkey{font-size:32px;color:var(--gold);}
.note{font-size:12px;color:var(--muted);margin-top:6px;}
</style>
</head>
<body>

<header id="hdr">
  <div>
    <div class="eyebrow" id="hEyebrow">Deutsch Drill</div>
    <div class="serif" id="hTitle" style="font-size:21px;color:var(--gold);margin-top:3px;">I tuoi blocchi</div>
    <div id="hSub" style="font-size:13px;color:var(--muted);margin-top:2px;">Scegli una chiave e parti</div>
  </div>
  <div style="display:flex;gap:8px;flex-shrink:0;">
    <button class="pill dim" id="btnBack" style="display:none;">Blocchi</button>
    <button class="pill dim" id="btnRestartTop" style="display:none;">Da capo</button>
    <button class="pill dim" id="btnSettings">Ritmo e voci</button>
  </div>
</header>

<div id="settings">
  <div class="row"><label>Pausa per tradurre: <span class="val" id="vPausa">10s</span></label>
    <input type="range" id="rPausa" min="5" max="20" step="1" value="10"></div>
  <div class="row"><label>Respiro tra le ripetizioni: <span class="val" id="vRitmo">1.3×</span></label>
    <input type="range" id="rRitmo" min="1" max="2.5" step="0.1" value="1.3"></div>
  <div class="row"><label>Velocità voce tedesca: <span class="val" id="vRate">0.90</span></label>
    <input type="range" id="rRate" min="0.6" max="1.2" step="0.05" value="0.9"></div>
  <div class="row"><label>Voce tedesca</label><select id="selDE"></select></div>
  <div class="row"><label>Voce italiana</label><select id="selIT"></select></div>
  <div class="note">Le impostazioni si salvano da sole. Telefono fuori dalla modalità silenziosa.</div>
</div>

<div id="screen-home"></div>

<div id="screen-player">
  <div class="center">
    <div id="idleBox" style="display:flex;flex-direction:column;align-items:center;gap:10px;">
      <div class="serif bigkey" id="idleKey"></div>
      <div id="idleGloss" style="color:var(--muted);"></div>
      <div class="idleflag" id="idleFlag"></div>
    </div>
    <div id="playBox" style="display:none;flex-direction:column;align-items:center;gap:14px;width:100%;">
      <div id="stepLabel"></div>
      <div class="serif" id="stepText"></div>
      <div id="pausebox">
        <div class="hint">Traducila a mente…</div>
        <div id="pbar"><div id="pfill"></div></div>
        <button id="skipbtn">Ho già tradotto, vai</button>
      </div>
    </div>
    <div id="doneBox" style="display:none;flex-direction:column;align-items:center;gap:8px;">
      <div class="serif" style="font-size:24px;color:var(--gold);">Geschafft!</div>
      <div style="font-size:14px;color:var(--muted);">Drill completato e segnato.</div>
    </div>
  </div>
  <div id="dots"></div>
  <footer id="controls"></footer>
</div>

<div id="overlay">
  <div class="body">
    <div class="eyebrow">Scomposizione</div>
    <div class="serif parts" id="oParts"></div>
    <div id="oPlines"></div>
    <p id="oLett"></p>
    <p><b>Immagine: </b><span id="oImm"></span></p>
    <p><b>Grammatica: </b><span id="oGram"></span></p>
    <p><b>Parenti: </b><span id="oPar"></span></p>
  </div>
  <div class="foot"><button class="pill gold" id="btnCloseOverlay">Chiudi</button></div>
</div>

<script>
const DATA = [{"block":1,"chiavi":[{"de":"nachvollziehen","gloss":"capire il perché, seguire il ragionamento","spiega":{"parti":[["nach","dietro, a seguire"],["vollziehen","compiere, eseguire"]],"letterale":"Letteralmente: ri-eseguire dietro qualcuno. Non capisci solo il risultato: ripercorri i suoi passi mentali uno per uno, finché il ragionamento torna anche a te.","immagine":"Il cliente ti spiega il suo problema e tu gli cammini dietro sugli stessi passi, orma dopo orma. Quando arrivi dove è arrivato lui: ich kann es nachvollziehen.","grammatica":"Verbo separabile, ma quasi sempre usato all'infinito con kann/konnte: Ich kann deine Entscheidung nachvollziehen.","parenti":"verstehen capisce il contenuto, nachvollziehen capisce il percorso. Cugino: vollziehen = eseguire (formale)."},"frasi":[["Capisco bene la tua decisione.","Ich kann deine Entscheidung gut nachvollziehen."],["Capisco bene la tua reazione.","Ich kann deine Reaktion gut nachvollziehen."],["Capisco perfettamente la frustrazione del cliente.","Ich kann den Frust vom Kunden total nachvollziehen."],["Riesci a capire perché ci vuole così tanto?","Kannst du nachvollziehen, warum das so lange dauert?"],["Lui non riusciva a capire i miei argomenti.","Er konnte meine Argumente nicht nachvollziehen."],["Sinceramente questo non riesco a capirlo.","Das kann ich ehrlich gesagt nicht nachvollziehen."],["Capisco che tu sia arrabbiato.","Ich kann nachvollziehen, dass du sauer bist."],["Si può ricostruire facilmente l'errore nel sistema.","Man kann den Fehler im System leicht nachvollziehen."],["Sono riuscito a capire la sua decisione solo più tardi.","Ich konnte seine Entscheidung erst später nachvollziehen."],["Se si legge la mail, si capisce tutto.","Wenn man die Mail liest, kann man alles nachvollziehen."]]},{"de":"sich lohnen","gloss":"valere la pena","spiega":{"parti":[["der Lohn","la paga, il salario"],["sich lohnen","ripagarsi"]],"letterale":"La cosa ti restituisce la fatica come uno stipendio: si paga da sola.","immagine":"Ogni sforzo è un turno di lavoro. Se a fine mese arriva la busta paga: es hat sich gelohnt.","grammatica":"Riflessivo e quasi sempre impersonale: es lohnt sich + zu, oppure das lohnt sich für uns.","parenti":"der Lohn = il salario. Simile: sich auszahlen = ripagarsi."},"frasi":[["Vale la pena alzarsi presto.","Es lohnt sich, früh aufzustehen."],["Vale la pena preparare il meeting.","Es lohnt sich, das Meeting vorzubereiten."],["Vale la pena chiamare direttamente il cliente.","Es lohnt sich, den Kunden direkt anzurufen."],["Lo sforzo è valso la pena.","Der Aufwand hat sich gelohnt."],["Il viaggio è valso assolutamente la pena.","Die Reise hat sich total gelohnt."],["Vale davvero la pena il nuovo laptop?","Lohnt sich der neue Laptop wirklich?"],["Per noi non ne vale la pena.","Das lohnt sich für uns nicht."],["È valsa la pena restare pazienti.","Es hat sich gelohnt, geduldig zu bleiben."],["Credimi, ne varrà la pena.","Glaub mir, es wird sich lohnen."],["Per due giorni l'hotel non vale la pena.","Für zwei Tage lohnt sich das Hotel nicht."]]},{"de":"Bescheid geben","gloss":"far sapere, avvisare","spiega":{"parti":[["der Bescheid","il responso, la comunicazione ufficiale"],["geben","dare"]],"letterale":"Dare il responso. Parola da ufficio tedesco: il Bescheid è la lettera con l'esito della pratica. Tu fai lo stesso con i colleghi, in piccolo.","immagine":"La letterina dell'Amt che ti comunica l'esito. Gib mir Bescheid = mandami la tua letterina, anche solo a voce.","grammatica":"Bescheid resta senza articolo. La persona va al dativo: gib MIR Bescheid.","parenti":"Bescheid sagen = identico, più colloquiale. Bescheid wissen = essere al corrente."},"frasi":[["Fammi sapere quando arrivi.","Gib mir Bescheid, wenn du da bist."],["Fammi sapere quando arriva il pacco.","Gib mir Bescheid, wenn das Paket ankommt."],["Fammi sapere al volo quando hai finito.","Gib mir kurz Bescheid, wenn du fertig bist."],["Ti faccio sapere domani.","Ich gebe dir morgen Bescheid."],["Il cliente non ci ha ancora fatto sapere.","Der Kunde hat uns noch nicht Bescheid gegeben."],["Puoi avvisare il team?","Kannst du dem Team Bescheid geben?"],["Ci fa sapere appena ne sa di più.","Sie gibt uns Bescheid, sobald sie mehr weiß."],["Perché nessuno mi ha avvisato?","Warum hat mir niemand Bescheid gegeben?"],["Avvisa il magazzino che arriva la consegna.","Sag dem Lager Bescheid, dass die Lieferung kommt."],["Ti faccio sapere se va in porto.","Ich gebe dir Bescheid, ob es klappt."]]},{"de":"eigentlich","gloss":"in realtà / a proposito","spiega":{"parti":[["eigen","proprio, peculiare"],["-lich","suffisso avverbiale"]],"letterale":"Per come stanno davvero le cose. Ha due anime: contrasto (in teoria sì... ma) e cambio di discorso (a proposito).","immagine":"Parola-spoiler: quando una frase inizia con eigentlich, sta quasi sempre per arrivare un MA. Eigentlich wollte ich... (ma non l'ho fatto).","grammatica":"Avverbio, non si declina mai. Nelle domande = a proposito: Was machst du eigentlich am Wochenende?","parenti":"eigen = proprio; die Eigenschaft = la caratteristica."},"frasi":[["In realtà volevo andare via prima.","Eigentlich wollte ich früher gehen."],["In realtà oggi volevo fare sport.","Eigentlich wollte ich heute Sport machen."],["In realtà avevo programmato altro.","Eigentlich hatte ich etwas anderes geplant."],["A proposito, che fai nel weekend?","Was machst du eigentlich am Wochenende?"],["A proposito, come si chiama lui?","Wie heißt er eigentlich?"],["In realtà non era pensata così.","Das war eigentlich nicht so gedacht."],["In realtà l'idea non è affatto male.","Eigentlich ist die Idee gar nicht schlecht."],["Veramente volevo solo chiedere una cosa al volo.","Ich wollte eigentlich nur kurz etwas fragen."],["In linea di massima sì, ma dipende dal prezzo.","Eigentlich ja, aber es hängt vom Preis ab."],["A proposito, che fine ha fatto il mio caffè?","Wo ist eigentlich mein Kaffee geblieben?"]]},{"de":"auffallen","gloss":"saltare all'occhio, notare","spiega":{"parti":[["auf","sopra, addosso"],["fallen","cadere"]],"letterale":"La cosa ti cade addosso da sola: non la cerchi tu, ti colpisce lei. Per questo il tedesco gira la frase: MIR ist aufgefallen — la cosa è caduta A ME.","immagine":"Una mela che ti casca in testa mentre pensi ad altro. Il dettaglio ti trova, non il contrario.","grammatica":"Chi nota va al dativo (mir, dir, dem Kunden). Perfekt con sein: ist aufgefallen.","parenti":"auffällig = vistoso, che si fa notare. bemerken = notare attivamente, cercando."},"frasi":[["Ho notato che manca qualcosa.","Mir ist aufgefallen, dass etwas fehlt."],["Ho notato che i numeri non tornano.","Mir ist aufgefallen, dass die Zahlen nicht stimmen."],["Ho subito notato il tuo taglio di capelli nuovo.","Mir ist sofort dein neuer Haarschnitt aufgefallen."],["Hai notato qualcosa di strano?","Ist dir etwas Komisches aufgefallen?"],["Per fortuna al cliente l'errore non è saltato all'occhio.","Dem Kunden ist der Fehler zum Glück nicht aufgefallen."],["L'errore salta all'occhio solo alla seconda occhiata.","Der Fehler fällt erst auf den zweiten Blick auf."],["Lei si fa notare ovunque.","Sie fällt überall auf."],["Salta all'occhio che lui non è mai puntuale.","Es fällt auf, dass er nie pünktlich ist."],["Non ho notato niente, davvero.","Mir ist nichts aufgefallen, ehrlich."],["Solo in metro ho notato che il telefono era sparito.","Erst in der U-Bahn ist mir aufgefallen, dass mein Handy weg war."]]},{"de":"hinkriegen","gloss":"farcela, riuscirci","spiega":{"parti":[["hin","verso là, a destinazione"],["kriegen","ottenere (colloquiale)"]],"letterale":"Portare la cosa fin là dove deve stare. Colloquiale e ottimista: il tono è sempre tranquillo, ce la si fa.","immagine":"Spingere un mobile pesante fino al suo angolo: alla fine ce l'hai messo là. Das kriegen wir hin.","grammatica":"Separabile e colloquiale. Il fratello formale è schaffen: wir schaffen das.","parenti":"kriegen = bekommen (colloquiale). Ancora più colloquiale: etwas gebacken kriegen."},"frasi":[["Ce la facciamo, tranquillo.","Das kriegen wir schon hin."],["Ce la facciamo entro venerdì.","Das kriegen wir bis Freitag hin."],["Ce la facciamo anche senza agenzia.","Das kriegen wir auch ohne Agentur hin."],["Come hai fatto così in fretta?","Wie hast du das so schnell hingekriegt?"],["Con la stampante proprio non ce la faccio.","Ich kriege das mit dem Drucker einfach nicht hin."],["Ha fatto la presentazione benissimo.","Sie hat die Präsentation super hingekriegt."],["Ce la fai da solo o ti aiuto?","Kriegst du das alleine hin oder soll ich helfen?"],["In qualche modo ce la facciamo sempre.","Irgendwie kriegen wir das immer hin."],["L'ha risolta con eleganza.","Das hat er elegant hingekriegt."],["Se il WiFi collabora, la call la portiamo a casa.","Wenn das WLAN mitspielt, kriegen wir den Call hin."]]},{"de":"sich Gedanken machen","gloss":"riflettere / preoccuparsi","spiega":{"parti":[["der Gedanke","il pensiero"],["sich machen","farsi (dativo)"]],"letterale":"Farsi dei pensieri — quasi identico all'italiano. Con über = riflettere su qualcosa; con um = essere in pensiero per qualcuno.","immagine":"Una fabbrica di pensieri in testa: il reparto über produce idee, il reparto um produce ansia. Mach dir keine Gedanken = spegni la fabbrica.","grammatica":"Riflessivo al DATIVO: ich mache MIR Gedanken, du machst DIR Gedanken.","parenti":"der Gedanke = il pensiero. nachdenken über = riflettere su (più attivo)."},"frasi":[["Non preoccuparti, si sistema.","Mach dir keine Gedanken, das klärt sich."],["Non preoccuparti della fattura.","Mach dir keine Gedanken über die Rechnung."],["Non pensarci, me ne occupo io.","Mach dir darüber keine Gedanken, das übernehme ich."],["Ho già riflettuto sul piano.","Ich habe mir schon Gedanken über den Plan gemacht."],["Hai pensato alle ferie?","Hast du dir Gedanken über den Urlaub gemacht?"],["Dovremmo riflettere sui costi.","Wir sollten uns Gedanken über die Kosten machen."],["Lei si fa troppi pensieri.","Sie macht sich zu viele Gedanken."],["Lui è in pensiero per sua madre.","Er macht sich Gedanken um seine Mutter."],["Non ci ho ancora pensato.","Darüber habe ich mir noch keine Gedanken gemacht."],["Non ti preoccupare, ce la facciamo.","Mach dir keine Gedanken, das kriegen wir hin."]]},{"de":"klappen","gloss":"funzionare, andare in porto","spiega":{"parti":[["die Klappe","lo sportello, la ribaltina"],["klappen","scattare al suo posto"]],"letterale":"In origine: chiudersi con un clac, come un sedile ribaltabile. Quando una cosa klappt, scatta al suo posto: clac, fatto.","immagine":"Il sedile della U-Bahn che si richiude da solo con un colpo secco. Tutto è andato dove doveva: es hat geklappt.","grammatica":"Quasi sempre impersonale: es klappt mit + dativo. Perfekt con haben: es hat geklappt.","parenti":"die Klappe = sportello (e anche: Halt die Klappe! = chiudi il becco). funktionieren = funzionare, in senso tecnico."},"frasi":[["È andato tutto bene?","Hat alles geklappt?"],["È andata in porto con l'appuntamento?","Hat es mit dem Termin geklappt?"],["È andata bene con la consegna?","Hat es mit der Lieferung geklappt?"],["Se tutto fila, finiamo alle sei.","Wenn alles klappt, sind wir um sechs fertig."],["Al primo tentativo non è andata.","Beim ersten Versuch hat es nicht geklappt."],["Andrà in porto, niente panico.","Das klappt schon, keine Panik."],["Purtroppo col volo non è andata.","Es hat leider nicht geklappt mit dem Flug."],["Per te giovedì va bene?","Klappt es bei dir am Donnerstag?"],["Senza piano B qui non funziona niente.","Ohne Plan B klappt hier gar nichts."],["Stavolta deve proprio andare in porto.","Diesmal muss es einfach klappen."]]}]},{"block":2,"chiavi":[{"de":"es liegt daran, dass","gloss":"dipende dal fatto che","spiega":{"parti":[["liegen","giacere, stare sdraiato"],["an","su, presso"]],"letterale":"La causa giace lì sopra. Il tedesco non dice che qualcosa dipende: dice che la causa sta sdraiata su un punto preciso.","immagine":"Il problema è un pacco. La causa è l'etichetta appiccicata sopra: alzi il pacco e la trovi lì, sdraiata sul punto esatto. Es liegt daran.","grammatica":"es liegt an + dativo. daran riprende la frase che segue col dass. Domanda: Woran liegt es?","parenti":"abhängen von = dipendere da (più formale). Das liegt an dir = è colpa tua / dipende da te."},"frasi":[["Dipende dal fatto che il sistema è lento.","Es liegt daran, dass das System langsam ist."],["Dipende dal fatto che il server è sovraccarico.","Es liegt daran, dass der Server überlastet ist."],["Dipende dal fatto che abbiamo poco personale.","Es liegt daran, dass wir zu wenig Personal haben."],["Da cosa dipende che non arriva niente?","Woran liegt es, dass nichts ankommt?"],["Non dipende da te.","Das liegt nicht an dir."],["Dipende dal tempo, semplicemente.","Das liegt am Wetter, ganz einfach."],["Dipendeva dal fatto che l'indirizzo era sbagliato.","Es lag daran, dass die Adresse falsch war."],["Forse dipende dalla connessione.","Vielleicht liegt es an der Internetverbindung."],["Non è questione di soldi, è questione di tempo.","Es liegt nicht am Geld, es liegt an der Zeit."],["Da cosa dipenda, ancora non lo sappiamo.","Woran es liegt, wissen wir noch nicht."]]},{"de":"ausmachen","gloss":"dispiacere / dare fastidio","spiega":{"parti":[["aus","fuori"],["machen","fare"]],"letterale":"Nel pattern fisso etwas/nichts ausmachen misura quanto una cosa ti pesa: macht nichts aus = effetto zero su di me.","immagine":"Una bilancia personale: ci metti sopra il rumore, il freddo, il ritardo. Se l'ago non si muove: das macht mir nichts aus.","grammatica":"La persona va al dativo: macht es DIR etwas aus? Forma di cortesia: Würde es Ihnen etwas ausmachen...?","parenti":"Attenzione ai fratelli: ausmachen = anche spegnere (das Licht ausmachen) e fissare (einen Termin ausmachen). stören = disturbare."},"frasi":[["Ti dispiace se apro la finestra?","Macht es dir etwas aus, wenn ich das Fenster öffne?"],["Ti dispiace se iniziamo più tardi?","Macht es dir etwas aus, wenn wir später anfangen?"],["Le dispiace aspettare un attimo?","Macht es Ihnen etwas aus, kurz zu warten?"],["Non mi dà fastidio, nessun problema.","Das macht mir nichts aus."],["Il freddo non gli dà fastidio.","Die Kälte macht ihm nichts aus."],["Il rumore, a dirla tutta, mi pesa parecchio.","Lärm macht mir ehrlich gesagt viel aus."],["Ti dispiacerebbe spegnere la luce?","Würde es dir etwas ausmachen, das Licht auszumachen?"],["Non mi pesa venire prima.","Es macht mir nichts aus, früher zu kommen."],["Vi dispiace se do forfait?","Macht es euch etwas aus, wenn ich absage?"],["Un giorno in più per noi non è un problema.","Ein Tag mehr macht uns nichts aus."]]},{"de":"verpassen","gloss":"perdere (treno, occasione)","spiega":{"parti":[["ver-","prefisso dell'andato storto"],["passen","combaciare, capitare al momento giusto"]],"letterale":"Il momento giusto ti passa davanti e tu non lo agganci. ver- è il prefisso che marca il fallimento.","immagine":"Il treno chiude le porte mentre arrivi sulla banchina: il momento c'era, tu no. Verpasst.","grammatica":"Transitivo normale, Perfekt con haben. NON si usa per gli oggetti: il portafoglio lo verlierst, non lo verpasst.","parenti":"verlieren = perdere oggetti. verschlafen = perdere qualcosa per aver dormito troppo."},"frasi":[["Ho perso l'autobus.","Ich habe den Bus verpasst."],["Ho perso la metro per un minuto.","Ich habe die U-Bahn um eine Minute verpasst."],["Ho perso l'inizio del meeting.","Ich habe den Anfang vom Meeting verpasst."],["Non perdere il treno!","Verpass den Zug nicht!"],["Ha mancato la scadenza di nuovo.","Er hat die Deadline schon wieder verpasst."],["Un'occasione così la si perde una volta sola.","So eine Chance verpasst man nur einmal."],["Ti sei perso qualcosa? Non molto.","Hast du etwas verpasst? Nicht viel."],["Ci siamo mancati per un pelo.","Wir haben uns knapp verpasst."],["Non voglio perdermi la chiamata del cliente.","Ich will den Anruf vom Kunden nicht verpassen."],["Meglio arrivare in anticipo che perdere il volo.","Lieber zu früh da sein als den Flug zu verpassen."]]},{"de":"sich vorstellen","gloss":"immaginarsi","spiega":{"parti":[["vor","davanti"],["stellen","mettere, collocare"]],"letterale":"Mettersi qualcosa davanti, agli occhi della mente. La scena viene piazzata davanti a te e tu la guardi.","immagine":"Un proiettore mentale: stell dir vor = accendi il proiettore e metti la scena sullo schermo.","grammatica":"Riflessivo al DATIVO: ich stelle MIR vor. Attenzione: con l'accusativo (ich stelle MICH vor) significa presentarsi!","parenti":"die Vorstellung = l'idea, ma anche lo spettacolo. sich (Akk) vorstellen = presentarsi."},"frasi":[["Immagina, abbiamo ottenuto l'incarico!","Stell dir vor, wir haben den Auftrag bekommen!"],["Immagina, il cliente si è scusato!","Stell dir vor, der Kunde hat sich entschuldigt!"],["Immagina, nevica a maggio.","Stell dir vor, es schneit im Mai."],["Me lo immagino bene.","Das kann ich mir gut vorstellen."],["Da lui non me lo aspetterei proprio.","Das kann ich mir bei ihm nicht vorstellen."],["Mi immagino che sia stato stressante.","Ich kann mir vorstellen, dass das stressig war."],["Non me l'ero immaginata così.","So habe ich mir das nicht vorgestellt."],["Come ti immagini la soluzione?","Wie stellst du dir die Lösung vor?"],["Si immagina di lavorare all'estero?","Können Sie sich vorstellen, im Ausland zu arbeiten?"],["Mi sto giusto immaginando la tua faccia.","Ich stelle mir gerade dein Gesicht vor."]]},{"de":"unbedingt","gloss":"assolutamente, a tutti i costi","spiega":{"parti":[["un-","senza"],["bedingt","condizionato (da die Bedingung = condizione)"]],"letterale":"Senza condizioni: lo voglio e basta, nessun se, nessun ma.","immagine":"Un contratto senza clausole: firmi senza nemmeno leggere le condizioni, perché non ce ne sono.","grammatica":"Avverbio, invariabile. La negazione attenua: nicht unbedingt = non necessariamente.","parenti":"die Bedingung = la condizione. auf jeden Fall = in ogni caso."},"frasi":[["Devi assolutamente dargli un'occhiata.","Das musst du dir unbedingt anschauen."],["Devi assolutamente vedere questa serie.","Du musst unbedingt diese Serie sehen."],["Dobbiamo assolutamente consegnare prima di mezzogiorno.","Wir müssen unbedingt vor zwölf liefern."],["Voglio a tutti i costi andare in Giappone.","Ich will unbedingt nach Japan."],["Voleva a tutti i costi avere ragione.","Er wollte unbedingt recht haben."],["Deve essere per forza oggi?","Muss das unbedingt heute sein?"],["Non necessariamente, ma sarebbe meglio.","Nicht unbedingt, aber es wäre besser."],["Chiamami assolutamente se c'è qualcosa.","Ruf mich unbedingt an, wenn etwas ist."],["Adesso non ci serve per forza.","Das brauchen wir jetzt nicht unbedingt."],["Assolutamente sì! Fammi sapere.","Unbedingt! Gib mir Bescheid."]]},{"de":"davon ausgehen","gloss":"presumere, dare per scontato","spiega":{"parti":[["aus","da"],["gehen","andare"],["davon","da ciò"]],"letterale":"Partire da ciò: la tua ipotesi è la stazione di partenza del ragionamento.","immagine":"Pianifichi un viaggio partendo da una stazione precisa. Quella stazione è la tua assunzione: ich gehe davon aus.","grammatica":"ausgehen von + dativo. Perfekt con sein: ich bin davon ausgegangen.","parenti":"vermuten = supporre. annehmen = presumere. Davon kannst du ausgehen = dallo per certo."},"frasi":[["Presumo che andrà tutto in porto.","Ich gehe davon aus, dass alles klappt."],["Presumo che la merce arrivi domani.","Ich gehe davon aus, dass die Ware morgen ankommt."],["Do per scontato che lui abbia letto la mail.","Ich gehe davon aus, dass er die Mail gelesen hat."],["Calcoliamo due settimane.","Wir gehen von zwei Wochen aus."],["Puoi darlo per certo.","Davon kannst du ausgehen."],["Dai per scontato che lui venga?","Gehst du davon aus, dass er kommt?"],["Non si può dare per scontato che tutti siano informati.","Man kann nicht davon ausgehen, dass alle Bescheid wissen."],["Da cosa partiamo col budget?","Wovon gehen wir beim Budget aus?"],["Davo per scontato che te ne occupassi tu.","Ich bin davon ausgegangen, dass du das übernimmst."],["Partiamo dall'ipotesi migliore.","Gehen wir mal vom Besten aus."]]},{"de":"aushalten","gloss":"sopportare, reggere","spiega":{"parti":[["aus","fino in fondo, fino alla fine"],["halten","tenere, reggere"]],"letterale":"Tenere fino alla fine. Non è un sopportare passivo: è tenere la presa su qualcosa di pesante senza mollare.","immagine":"Una plank in palestra: stai tenendo (halten) la posizione, il trainer dice ancora dieci secondi, e tu tieni fino alla fine (aus). Ich halte... aus.","grammatica":"Verbo separabile: aus schizza in fondo alla frase. Al Perfekt si riattacca: Ich habe es ausgehalten.","parenti":"durchhalten = tenere duro nel tempo (durch = attraverso). aushalten regge un peso, durchhalten regge una maratona."},"frasi":[["Non sopporto più questo rumore.","Ich halte diesen Lärm nicht mehr aus."],["Non sopporto più questo caldo in ufficio.","Ich halte diese Hitze im Büro nicht mehr aus."],["Non sopporto più questi meeting del lunedì.","Ich halte diese Montagsmeetings nicht mehr aus."],["Lui non regge più lo stress con il cliente.","Er hält den Stress mit dem Kunden nicht mehr aus."],["Come fai a sopportarlo ogni giorno?","Wie hältst du das jeden Tag aus?"],["Tranquillo, lo reggiamo.","Keine Sorge, das halten wir schon aus."],["La tensione è quasi insopportabile.","Die Spannung ist kaum auszuhalten."],["Lì ho resistito solo due giorni.","Ich habe es dort nur zwei Tage ausgehalten."],["Senza caffè la mattinata non la reggo.","Ohne Kaffee halte ich den Vormittag nicht aus."],["Bisogna prima saperlo reggere.","Das muss man erstmal aushalten."]]},{"de":"vorbeikommen","gloss":"passare (da qualcuno)","spiega":{"parti":[["vorbei","oltre, davanti"],["kommen","venire"]],"letterale":"Venire passando: una visita di passaggio, informale, senza cerimonie.","immagine":"L'amico che suona al citofono perché passava di lì. Nessun appuntamento, nessuna agenda: komm vorbei.","grammatica":"Separabile, Perfekt con sein. La persona con bei + dativo: ich komme bei dir vorbei.","parenti":"vorbeigehen / vorbeifahren = passare a piedi / in macchina. Figurato: an etwas nicht vorbeikommen = non poter evitare qualcosa."},"frasi":[["Passa da me stasera!","Komm doch heute Abend vorbei!"],["Passa un attimo dopo il lavoro!","Komm doch nach der Arbeit kurz vorbei!"],["Passa nel weekend per un caffè!","Komm doch am Wochenende auf einen Kaffee vorbei!"],["Domani passo da te.","Ich komme morgen bei dir vorbei."],["Il tecnico passa tra le otto e le dodici.","Der Techniker kommt zwischen acht und zwölf vorbei."],["Puoi passare un attimo in ufficio?","Kannst du kurz im Büro vorbeikommen?"],["Ieri lei è passata senza preavviso.","Sie ist gestern unangekündigt vorbeigekommen."],["Quando ripassi a trovarci?","Wann kommst du mal wieder vorbei?"],["Questo tema non possiamo evitarlo.","An diesem Thema kommen wir nicht vorbei."],["Passa se sei in zona.","Komm vorbei, wenn du in der Nähe bist."]]}]},{"block":3,"chiavi":[{"de":"sich melden","gloss":"farsi sentire, farsi vivo","spiega":{"parti":[["melden","segnalare, notificare"],["sich","se stessi"]],"letterale":"Segnalare se stessi: far sapere che esisti. Radice burocratico-militare, la stessa del Meldeamt dove ti registri.","immagine":"La manina alzata in classe: ich melde mich = mi segnalo, eccomi.","grammatica":"sich melden bei + dativo (la persona). Caso speciale: sich krank melden = darsi malato.","parenti":"die Anmeldung = la registrazione (l'incubo di ogni italiano in Germania). Bescheid geben = far sapere, cugino stretto."},"frasi":[["Fatti sentire se ti serve aiuto.","Meld dich, wenn du Hilfe brauchst."],["Fatti sentire quando sei a Berlino.","Meld dich, wenn du in Berlin bist."],["Fatti sentire se qualcosa non è chiaro.","Meld dich einfach, wenn etwas unklar ist."],["Mi faccio sentire domani.","Ich melde mich morgen bei dir."],["Il cliente non si è ancora fatto sentire.","Der Kunde hat sich immer noch nicht gemeldet."],["Perché non ti fai mai sentire?","Warum meldest du dich nie?"],["Lei si è data malata.","Sie hat sich krank gemeldet."],["Mi faccio vivo appena ne so di più.","Ich melde mich, sobald ich mehr weiß."],["Se non risponde nessuno, chiama la hotline.","Falls sich niemand meldet, ruf die Hotline an."],["Lui si fa sentire solo quando gli serve qualcosa.","Er meldet sich immer nur, wenn er etwas braucht."]]},{"de":"passen","gloss":"andare bene (orari, misure)","spiega":{"parti":[["passen","stare al posto giusto, della misura giusta"]],"letterale":"Stare al posto giusto: vale per i vestiti, per gli orari, per i piani. Una sola parola per tutto ciò che combacia.","immagine":"Un pezzo di puzzle: se entra nel buco senza forzare, passt. Vale per il martedì alle dieci come per i pantaloni.","grammatica":"La persona al dativo: passt MIR. Con zu = abbinarsi: das passt zu dir. Da solo come risposta: Passt!","parenti":"passend = adatto. verpassen = perdere il momento (il fratello andato storto, Block 2)."},"frasi":[["Ti va bene martedì?","Passt es dir am Dienstag?"],["Ti va bene alle dieci?","Passt es dir um zehn?"],["Ti va bene l'appuntamento la prossima settimana?","Passt dir der Termin nächste Woche?"],["Mi va benissimo.","Das passt mir gut."],["Va bene! A dopo.","Passt! Bis dann."],["I pantaloni non mi vanno più.","Die Hose passt mir nicht mehr."],["L'appuntamento purtroppo non va bene.","Der Termin passt leider nicht."],["Se non ti va bene, fammi semplicemente sapere.","Wenn es dir nicht passt, gib einfach Bescheid."],["Si incastra perfettamente col nostro piano.","Das passt perfekt zu unserem Plan."],["A lui non va mai bene niente.","Irgendetwas passt ihm nie."]]},{"de":"sich verlassen auf","gloss":"contare su, fare affidamento","spiega":{"parti":[["verlassen","lasciare, abbandonare"],["auf","su"]],"letterale":"Lasciarsi andare su qualcosa: ti appoggi con tutto il peso, fidandoti che regga. Da solo verlassen significa abbandonare; col riflessivo e auf si ribalta in fiducia totale.","immagine":"Il gioco della fiducia: ti lasci cadere all'indietro sapendo che il collega ti prende. Ich verlasse mich auf dich.","grammatica":"Sempre con auf + accusativo. darauf riprende la frase: du kannst dich darauf verlassen, dass...","parenti":"zuverlässig = affidabile (chi regge quando ti ci appoggi). vertrauen = fidarsi."},"frasi":[["Puoi contare su di me.","Du kannst dich auf mich verlassen."],["Puoi contare sul team.","Du kannst dich auf das Team verlassen."],["Puoi contare sul fatto che consegniamo.","Du kannst dich darauf verlassen, dass wir liefern."],["Conto su di te.","Ich verlasse mich auf dich."],["Abbiamo fatto affidamento sulla conferma.","Wir haben uns auf die Zusage verlassen."],["Sui treni non si può sempre contare.","Auf die Bahn kann man sich nicht immer verlassen."],["Non affidarti solo alla fortuna.","Verlass dich nicht nur auf dein Glück."],["Su quello non ci conterei.","Darauf würde ich mich nicht verlassen."],["Lei si affida completamente al suo istinto.","Sie verlässt sich ganz auf ihr Gefühl."],["Contaci!","Verlass dich drauf!"]]},{"de":"besorgen","gloss":"procurare","spiega":{"parti":[["be-","prefisso del prendersi carico"],["sorgen","occuparsi (da die Sorge = preoccupazione)"]],"letterale":"Prendersi cura che la cosa ci sia. Non è solo comprare: è risolvere il problema del reperimento, in qualunque modo.","immagine":"Il collega che dice ci penso io: come arrivi il caffè non importa, il caffè arriva. Ich besorge das.","grammatica":"Transitivo, spesso con doppio oggetto: jemandem etwas besorgen (procurare qualcosa a qualcuno).","parenti":"kaufen = comprare e basta. sich kümmern um = occuparsi di. die Besorgung = la commissione."},"frasi":[["Le bevande le procuro io.","Ich besorge die Getränke."],["I biglietti per venerdì li prendo io.","Ich besorge die Tickets für Freitag."],["Ci procuro qualcosa per pranzo.","Ich besorge uns etwas zum Mittagessen."],["Puoi procurare il caffè per l'ufficio?","Kannst du Kaffee fürs Büro besorgen?"],["Chi procura il proiettore per la presentazione?","Wer besorgt den Beamer für die Präsentation?"],["Ti ho procurato il libro.","Ich habe dir das Buch besorgt."],["Si può procurare in fretta.","Das lässt sich schnell besorgen."],["Ha procurato i ricambi tramite un collega.","Er hat die Ersatzteile über einen Kollegen besorgt."],["Procurami i documenti entro domani, per favore.","Besorg mir bitte die Unterlagen bis morgen."],["Fatto: procurato tutto.","Erledigt — alles besorgt."]]},{"de":"vereinbaren","gloss":"concordare, fissare","spiega":{"parti":[["ver-","prefisso del trasformare"],["ein","uno"],["-baren","rendere"]],"letterale":"Rendere uno: due opinioni diverse diventano UNA cosa sola, messa nero su bianco.","immagine":"Una stretta di mano: due mani, un accordo. Vereinbart.","grammatica":"Transitivo, registro formale. La formula d'oro delle mail: wie vereinbart = come concordato.","parenti":"die Vereinbarung = l'accordo. Informali: ausmachen e abmachen (abgemacht! = affare fatto)."},"frasi":[["Abbiamo fissato un appuntamento.","Wir haben einen Termin vereinbart."],["Abbiamo concordato una richiamata per domani.","Wir haben einen Rückruf für morgen vereinbart."],["Abbiamo concordato un prezzo.","Wir haben einen Preis vereinbart."],["Fissiamo un appuntamento.","Lass uns einen Termin vereinbaren."],["Possiamo concordare un incontro per la settimana prossima?","Können wir ein Treffen für nächste Woche vereinbaren?"],["Non eravamo d'accordo così!","Das war so nicht vereinbart!"],["Come concordato, Le invio i documenti.","Wie vereinbart schicke ich Ihnen die Unterlagen."],["I dettagli li concordiamo al telefono.","Die Details vereinbaren wir am Telefon."],["Famiglia e lavoro non sono sempre facili da conciliare.","Familie und Job sind nicht immer leicht zu vereinbaren."],["Concordiamo così: voi consegnate, noi paghiamo.","Wir vereinbaren: Sie liefern, wir zahlen."]]},{"de":"sich auskennen","gloss":"intendersi di, sapersi orientare","spiega":{"parti":[["aus","fino in fondo"],["kennen","conoscere"]],"letterale":"Conoscere una cosa fino in fondo: saperti muovere dentro senza perderti.","immagine":"La tua città: non sai il nome di tutte le vie, ma non ti perdi mai. Ich kenne mich hier aus.","grammatica":"Riflessivo. Con mit per gli argomenti (mit Excel), con in per i luoghi (in Berlin).","parenti":"der Experte = l'esperto. sich orientieren = orientarsi."},"frasi":[["Te ne intendi di Excel?","Kennst du dich mit Excel aus?"],["Te ne intendi di dogane?","Kennst du dich mit Zöllen aus?"],["Te ne intendi di vino?","Kennst du dich mit Wein aus?"],["Qui non mi oriento.","Ich kenne mich hier nicht aus."],["Lui conosce il sistema alla perfezione.","Er kennt sich mit dem System bestens aus."],["Di questo purtroppo non me ne intendo.","Da kenne ich mich leider nicht aus."],["Lei conosce bene Berlino.","Sie kennt sich in Berlin gut aus."],["Chiedi a Matías, lui se ne intende.","Frag Matias, der kennt sich damit aus."],["Della nuova app non ci capisce ancora nessuno.","Mit der neuen App kennt sich noch keiner aus."],["So il fatto mio, fidati.","Ich kenne mich aus, vertrau mir."]]},{"de":"verzichten auf","gloss":"rinunciare a, fare a meno di","spiega":{"parti":[["verzichten","cedere un diritto (radice giuridica latina)"],["auf","a, su"]],"letterale":"Cedi formalmente qualcosa che ti spetterebbe. Con auf indichi la cosa a cui volti le spalle.","immagine":"Il buffet: la torta è lì, hai tutto il diritto di prenderla, e la lasci lì. Ich verzichte auf den Nachtisch.","grammatica":"Sempre verzichten auf + accusativo. Con frase: darauf verzichten, etwas zu tun.","parenti":"der Verzicht = la rinuncia. aufgeben = mollare, arrendersi (più drastico)."},"frasi":[["Oggi rinuncio al caffè.","Ich verzichte heute auf Kaffee."],["Oggi rinuncio allo zucchero.","Ich verzichte heute auf Zucker."],["Stavolta rinuncio al dolce.","Ich verzichte diesmal auf den Nachtisch."],["Di questo faccio volentieri a meno.","Darauf kann ich gut verzichten."],["Al telefono non potrei rinunciare.","Auf mein Handy könnte ich nicht verzichten."],["Rinunciamo alle spese di spedizione.","Wir verzichten auf die Versandkosten."],["Lui ha rinunciato alle sue ferie.","Er hat auf seinen Urlaub verzichtet."],["Possiamo fare a meno del meeting?","Können wir auf das Meeting verzichten?"],["Di un commento così avrei fatto volentieri a meno.","Auf so einen Kommentar hätte ich verzichten können."],["Nessuno vuole rinunciare alla comodità.","Niemand will auf Komfort verzichten."]]},{"de":"zur Verfügung stehen","gloss":"essere / mettere a disposizione","spiega":{"parti":[["die Verfügung","il disporre (da verfügen über = disporre di)"],["stehen / stellen","stare / mettere"]],"letterale":"Al disporre: la cosa STA lì pronta (stehen), perché qualcuno ce l'ha MESSA (stellen). Coppia stato/azione, classico del tedesco.","immagine":"Il carrello degli attrezzi in officina: steht zur Verfügung perché il capo officina l'ha gestellt. Tu devi solo allungare la mano.","grammatica":"La persona al dativo: das steht DIR zur Verfügung; wir stellen IHNEN die Daten zur Verfügung.","parenti":"verfügbar = disponibile. bereitstellen = predisporre."},"frasi":[["Resto volentieri a Sua disposizione.","Ich stehe Ihnen gern zur Verfügung."],["Per domande sono sempre a disposizione.","Bei Fragen stehe ich jederzeit zur Verfügung."],["Il team è disponibile da lunedì.","Das Team steht ab Montag zur Verfügung."],["La sala è a nostra disposizione fino alle sei.","Der Raum steht uns bis sechs zur Verfügung."],["Le mettiamo a disposizione i dati.","Wir stellen Ihnen die Daten zur Verfügung."],["L'azienda mette a disposizione un laptop a tutti.","Die Firma stellt allen einen Laptop zur Verfügung."],["Purtroppo oggi l'ascensore non è disponibile.","Leider steht der Fahrstuhl heute nicht zur Verfügung."],["Più budget non ce n'è a disposizione.","Mehr Budget steht uns nicht zur Verfügung."],["Puoi mettermi a disposizione il file?","Kannst du mir die Datei zur Verfügung stellen?"],["Il mio ufficio è a tua disposizione.","Mein Büro steht dir zur Verfügung."]]}]},{"block":4,"chiavi":[{"de":"sich freuen auf / über","gloss":"non vedere l'ora di / essere contento di","spiega":{"parti":[["freuen","rallegrarsi"],["auf","verso (qualcosa che deve ancora arrivare)"],["über","su (qualcosa già accaduto)"]],"letterale":"Rallegrarsi VERSO qualcosa: la preposizione ti dice se la gioia guarda avanti o indietro. auf = aspetto qualcosa che verrà; über = sono contento di qualcosa già successo.","immagine":"Il cane alla finestra che scodinzola guardando la strada perché sa che torni: si rallegra AUF il tuo arrivo. Quando entri e ti fa le feste, si rallegra ÜBER te.","grammatica":"Riflessivo: ich freue mich. freuen auf + accusativo (futuro), freuen über + accusativo (cosa già avvenuta).","parenti":"die Vorfreude = la gioia dell'attesa, parola intraducibile e tipicamente tedesca. sich freuen, dass... per le frasi intere."},"frasi":[["Non vedo l'ora che arrivi il weekend. Già da lunedì.","Ich freue mich auf das Wochenende. Schon seit Montag."],["Non vediamo l'ora che veniate a trovarci.","Wir freuen uns auf euren Besuch."],["Non vedo l'ora delle ferie.","Ich freue mich auf den Urlaub."],["È stata contentissima dei fiori.","Sie hat sich über die Blumen total gefreut."],["Lui è contento di ogni piccolo complimento.","Er freut sich über jedes kleine Lob."],["Mi sono rallegrato troppo presto.","Ich habe mich zu früh gefreut."],["Cos'è che aspetti di più?","Worauf freust du dich am meisten?"],["Non vedo l'ora che stacchi.","Ich freue mich auf den Feierabend."],["Sei contento, o sei solo gentile?","Freust du dich, oder bist du nur höflich?"],["Di cosa sei più contento in questo momento?","Worüber freust du dich gerade am meisten?"]]},{"de":"dauern","gloss":"durare, volerci tempo","spiega":{"parti":[["dauern","durare (radice di die Dauer = la durata)"]],"letterale":"Occupare un tratto di tempo. Quasi sempre impersonale: es dauert. La domanda chiave è wie lange.","immagine":"La rotellina che gira sullo schermo: non vedi succedere niente, ma il tempo scorre. Es dauert.","grammatica":"Impersonale: es dauert + durata. Con la persona al dativo: bei mir dauert es länger.","parenti":"die Dauer = la durata. dauerhaft = duraturo. andauernd = di continuo, in continuazione."},"frasi":[["Quanto ci vuole ancora?","Wie lange dauert das noch?"],["Il meeting è durato tre ore. Tre.","Das Meeting hat drei Stunden gedauert. Drei."],["Ci vogliono solo cinque minuti, promesso.","Es dauert nur fünf Minuten, versprochen."],["Da me la mattina tutto richiede un po' più di tempo.","Bei mir dauert morgens alles etwas länger."],["Le cose buone richiedono tempo, si sa.","Gute Dinge dauern eben."],["Quanto ci vuole per la consegna?","Wie lange dauert die Lieferung?"],["Il download dura un'eternità.","Der Download dauert ewig."],["Ci vuole il tempo che ci vuole.","Es dauert so lange, wie es eben dauert."],["La riparazione ha richiesto molto tempo?","Hat die Reparatur lange gedauert?"],["Tranquillo, non ci vuole molto.","Keine Sorge, das dauert nicht lange."]]},{"de":"abholen","gloss":"andare a prendere, ritirare","spiega":{"parti":[["ab","via, da un punto preciso"],["holen","andare a prendere"]],"letterale":"Prendere via da un punto: vai dove la cosa o la persona si trova e la porti via con te.","immagine":"Il braccio della gru nelle macchinette dei peluche: scende sul punto esatto, aggancia, e tira su. Ich hole dich ab.","grammatica":"Separabile, ab vola in fondo: ich hole dich um acht ab. Perfekt: abgeholt.","parenti":"holen = prendere (senza il punto di partenza). einholen = recuperare un distacco. Figurato: jemanden abholen = partire dal livello dell'altro."},"frasi":[["Mi vieni a prendere alla stazione?","Kannst du mich vom Bahnhof abholen?"],["Ritiro il pacco domani.","Ich hole das Paket morgen ab."],["Oggi va a prendere i bambini prima.","Er holt die Kinder heute früher ab."],["Il pacco è lì da una settimana. Devo davvero ritirarlo.","Das Paket liegt seit einer Woche da. Ich muss es wirklich mal abholen."],["Passo a prenderti o vieni da solo?","Soll ich dich abholen, oder kommst du selbst?"],["Mi vieni a prendere all'aeroporto?","Kannst du mich vom Flughafen abholen?"],["Ho ritirato il pacco ieri.","Ich habe das Paket gestern abgeholt."],["Mi passi a prendere alle otto?","Holst du mich um acht ab?"],["Chi va a prendere gli ospiti domani?","Wer holt morgen die Gäste ab?"],["Ti vengo a prendere, nessun problema.","Ich hole dich ab, kein Problem."]]},{"de":"schaffen","gloss":"farcela, riuscire","spiega":{"parti":[["schaffen","farcela / creare (due anime)"]],"letterale":"Portare a termine nonostante l'ostacolo. Attenzione: schaffen vuol dire anche creare (erschaffen). Qui è il farcela: es schaffen.","immagine":"Il traguardo di una corsa: arrivi quasi a gattoni, ma tagli la linea. Geschafft! (che vuol dire sia fatto! sia distrutto).","grammatica":"es schaffen + zu + infinito. Geschafft! da solo = ce l'ho fatta / sono a pezzi.","parenti":"hinkriegen = versione colloquiale (Block 1). die Schaffenskraft = la forza creativa. Da non confondere con Schafe = pecore."},"frasi":[["Ce la facciamo, dai.","Das schaffen wir schon."],["Non sono riuscito a chiamarti oggi. Scusa.","Ich habe es heute nicht geschafft, dich anzurufen. Sorry."],["Ce la fai entro venerdì?","Schaffst du das bis Freitag?"],["Ce l'abbiamo fatta per un pelo.","Wir haben es gerade noch geschafft."],["Una cosa alla volta, e ce la facciamo con tutto.","Eins nach dem anderen, dann schaffen wir alles."],["Ce la facciamo entro stasera.","Das schaffen wir bis heute Abend."],["Ce la fai da solo, o ti aiuto?","Schaffst du das alleine, oder soll ich helfen?"],["Ha superato l'esame senza problemi.","Sie hat die Prüfung locker geschafft."],["Fatto! Finalmente.","Geschafft! Endlich."],["Ce l'abbiamo fatta, e nessuno sa bene come.","Wir haben es geschafft, und keiner weiß genau, wie."]]},{"de":"sich erkundigen nach","gloss":"informarsi su","spiega":{"parti":[["er-","prefisso del portare a compimento"],["Kunde","qui nel senso antico di notizia, sapere"],["nach","riguardo a"]],"letterale":"Procurarsi notizia su qualcosa. Quel Kunde non è il cliente: è il vecchio senso di sapere/notizia, lo stesso di Erdkunde (geografia).","immagine":"Il detective che bussa di porta in porta col taccuino per raccogliere informazioni. Ich erkundige mich.","grammatica":"Riflessivo: sich erkundigen nach + dativo. Più formale di fragen.","parenti":"die Auskunft = l'informazione (lo sportello). fragen = chiedere, semplice. sich auskennen = intendersi (Block 3, stessa radice Kunde)."},"frasi":[["Mi informo sui prezzi.","Ich erkundige mich mal nach den Preisen."],["Ha chiesto di te.","Er hat sich nach dir erkundigt."],["Puoi informarti se l'appuntamento è confermato?","Kannst du dich erkundigen, ob der Termin noch steht?"],["Mi sono informato: è complicato. Come sempre.","Ich habe mich erkundigt: Es ist kompliziert. Wie immer."],["Meglio informarsi prima, sennò trovi chiuso.","Erkundige dich lieber vorher, sonst stehst du vor verschlossener Tür."],["Mi informo sugli orari di apertura.","Ich erkundige mich nach den Öffnungszeiten."],["Ti sei già informato sul treno?","Hast du dich schon nach dem Zug erkundigt?"],["Lei si informa sulle nuove regole.","Sie erkundigt sich nach den neuen Regeln."],["Informati prima di prenotare.","Erkundige dich, bevor du buchst."],["Lui non si informa mai prima.","Er erkundigt sich nie vorher."]]},{"de":"beantragen","gloss":"richiedere ufficialmente","spiega":{"parti":[["be-","prendersi carico di"],["Antrag","la domanda ufficiale (da tragen, portare)"]],"letterale":"Portare avanti una domanda ufficiale. L'Antrag è IL modulo: l'incubo tedesco per eccellenza.","immagine":"Lo sportello dell'Amt, il numerino in mano, il modulo in triplice copia. Beantragen è l'atto eroico di consegnarlo.","grammatica":"Transitivo: etwas beantragen. Con sostantivo: einen Antrag stellen = fare domanda.","parenti":"der Antrag = la domanda (e pure la proposta di matrimonio!). die Beantragung = l'inoltro. genehmigen = approvare, il passo dopo."},"frasi":[["Ho richiesto un passaporto nuovo.","Ich habe einen neuen Pass beantragt."],["Hai già richiesto le ferie?","Hast du den Urlaub schon beantragt?"],["Per richiederlo servono tre moduli e molta pazienza.","Um das zu beantragen, braucht man drei Formulare und viel Geduld."],["Richiedo tutto online. In teoria si può.","Ich beantrage alles online. Theoretisch geht das."],["Abbiamo richiesto il rimborso due mesi fa. Stiamo ancora aspettando.","Wir haben die Erstattung vor zwei Monaten beantragt. Wir warten noch."],["Ho richiesto un visto nuovo.","Ich habe ein neues Visum beantragt."],["Hai già richiesto l'assegno familiare?","Hast du das Kindergeld schon beantragt?"],["Il documento nuovo l'ho richiesto a marzo. Siamo a giugno.","Den neuen Ausweis habe ich im März beantragt. Wir haben Juni."],["Richiedilo oggi piuttosto che domani, tanto ci vuole comunque.","Beantrag es lieber heute als morgen, das dauert sowieso."],["Lei ha richiesto il congedo parentale.","Sie hat Elternzeit beantragt."]]},{"de":"sich herausstellen","gloss":"venir fuori che, rivelarsi","spiega":{"parti":[["heraus","fuori, verso di noi"],["stellen","mettere"]],"letterale":"Mettersi fuori da sé: la verità che era nascosta esce allo scoperto da sola. Non la cerchi tu, si rivela.","immagine":"Il colpo di scena del giallo: la tenda si apre e la verità è lì in piedi sul palco. Es stellt sich heraus...","grammatica":"Riflessivo impersonale: es stellt sich heraus, dass... Perfekt: herausgestellt.","parenti":"sich zeigen = mostrarsi. rauskommen (colloquiale) = venire a galla. herausfinden = scoprire (attivo, lo fai tu)."},"frasi":[["È venuto fuori che il problema era tutt'altrove.","Es hat sich herausgestellt, dass das Problem ganz woanders lag."],["Alla fine è risultato che avevano ragione entrambi.","Am Ende stellte sich heraus, dass beide recht hatten."],["Sta venendo fuori che l'appuntamento alla fine non va bene.","Es stellt sich gerade heraus, dass der Termin doch nicht passt."],["Se viene fuori che mi sbagliavo, offro un caffè.","Falls sich herausstellt, dass ich falsch lag, gebe ich einen Kaffee aus."],["Come si è scoperto, la mail non era mai arrivata.","Wie sich herausgestellt hat, war die E-Mail nie angekommen."],["È venuto fuori che l'indirizzo era sbagliato.","Es hat sich herausgestellt, dass die Adresse falsch war."],["È venuto fuori che nessuno aveva prenotato la sala.","Es stellte sich heraus, dass niemand den Raum gebucht hatte."],["È venuto fuori che dipendeva da me. Imbarazzante.","Es stellte sich heraus, dass es an mir lag. Peinlich."],["Spesso si scopre dopo che la soluzione era semplice.","Oft stellt sich später heraus, dass die Lösung simpel war."],["Si vedrà chi aveva ragione.","Es wird sich schon herausstellen, wer recht hatte."]]},{"de":"ausgerechnet","gloss":"proprio, guarda caso","spiega":{"parti":[["aus","fuori"],["gerechnet","calcolato (da rechnen, calcolare)"]],"letterale":"Calcolato apposta: come se il destino avesse fatto i conti per colpire proprio quel momento o quella persona. Ironia tedesca allo stato puro.","immagine":"Murphy in persona col pallottoliere, che sceglie con cura il momento peggiore. Ausgerechnet jetzt.","grammatica":"Avverbio invariabile, si piazza davanti alla parola presa di mira: ausgerechnet heute, ausgerechnet du.","parenti":"gerade = proprio, ma neutro. sogar = persino. ausgerechnet ha sempre un retrogusto di lamentela."},"frasi":[["Proprio oggi i treni sono in sciopero.","Ausgerechnet heute streikt die Bahn."],["Perché lo chiedi proprio a me?","Warum fragst du ausgerechnet mich?"],["Mi sono ammalato proprio in vacanza.","Ausgerechnet im Urlaub wurde ich krank."],["Ha ordinato proprio il vino più caro.","Er hat ausgerechnet den teuersten Wein bestellt."],["Proprio adesso la stampante è rotta.","Ausgerechnet jetzt ist der Drucker kaputt."],["Proprio oggi piove a dirotto.","Ausgerechnet heute regnet es in Strömen."],["Proprio al meeting più importante il WiFi ha fatto i capricci.","Ausgerechnet beim wichtigsten Meeting hat das WLAN gestreikt."],["Proprio il capo se n'è accorto per primo.","Ausgerechnet der Chef hat es zuerst gemerkt."],["Doveva succedere proprio adesso?","Musste das ausgerechnet jetzt passieren?"],["Proprio tu me lo dici.","Ausgerechnet du sagst mir das."]]}]},{"block":5,"chiavi":[{"de":"nerven","gloss":"scocciare, dare ai nervi","spiega":{"parti":[["nerven","da der Nerv = il nervo"]],"letterale":"Andare dritto sul nervo. In tedesco non dai sui nervi: tu SEI il nervo che viene toccato. Il soggetto è chi scoccia, non chi la subisce.","immagine":"Il dentista che tocca il nervo scoperto senza anestesia: zack. Du nervst.","grammatica":"Transitivo: jemanden nerven. Es nervt = è una scocciatura. genervt sein = essere esasperato.","parenti":"der Nerv = il nervo. genervt = spazientito. Versione lunga: jemandem auf die Nerven gehen = dare sui nervi a qualcuno."},"frasi":[["Mi stai scocciando.","Du nervst."],["Il rumore dà sui nervi.","Der Lärm nervt."],["Questa pubblicità è una scocciatura pazzesca.","Diese Werbung nervt total."],["Smettila di scocciarmi.","Hör auf, mich zu nerven."],["Scoccia quando l'autobus arriva in ritardo.","Es nervt, wenn der Bus zu spät kommt."],["Il suo tono mi ha dato davvero sui nervi.","Sein Ton hat mich echt genervt."],["Dà sui nervi anche a te questa cosa?","Nervt dich das auch so?"],["Oggi sono proprio esasperato.","Ich bin total genervt heute."],["Niente scoccia più di un WiFi lento.","Nichts nervt mehr als ein langsames WLAN."],["Mi dà sui nervi, ma le voglio bene lo stesso.","Sie nervt mich, aber ich mag sie trotzdem."]]},{"de":"zugeben","gloss":"ammettere","spiega":{"parti":[["zu","verso, in aggiunta"],["geben","dare"]],"letterale":"Dare in aggiunta: metti sul tavolo anche la parte che avresti voluto tenere nascosta.","immagine":"A carte scoperte: butti giù anche la carta che tenevi coperta. Ich gebe es zu.","grammatica":"Separabile, zu vola in fondo: ich gebe meinen Fehler zu. Come inciso: zugegeben, ... = lo ammetto, ...","parenti":"gestehen = confessare (più forte, anche legale). die Zugabe = il bis del concerto, letteralmente il dato in più."},"frasi":[["Lo ammetto.","Ich gebe es zu."],["Ammetto il mio errore.","Ich gebe meinen Fehler zu."],["Ammettilo e basta!","Gib es einfach zu!"],["Ha ammesso di essersi sbagliato.","Er hat zugegeben, dass er falsch lag."],["Lei non ammette mai niente.","Sie gibt nie etwas zu."],["Lo ammetto, non è stata una buona idea.","Zugegeben, das war keine gute Idee."],["Devo ammettere che avevi ragione.","Ich muss zugeben, du hattest recht."],["Ammetti di esserti dimenticato?","Gibst du zu, dass du es vergessen hast?"],["Nessuno vuole ammettere l'errore.","Niemand will den Fehler zugeben."],["Va bene, lo ammetto, il film alla fine era bello.","Okay, zugegeben, der Film war doch gut."]]},{"de":"erwischen","gloss":"beccare, acchiappare al volo","spiega":{"parti":[["erwischen","agguantare al volo, nell'attimo giusto"]],"letterale":"Agguantare qualcosa o qualcuno proprio nell'attimo giusto: il treno, il ladro, o tuo figlio con la mano nella Nutella.","immagine":"La mano che si chiude di scatto su una mosca: erwischt!","grammatica":"Transitivo. jemanden erwischen (beccare sul fatto), den Zug erwischen (prendere al volo), es hat mich erwischt = mi sono ammalato.","parenti":"verpassen = il contrario, mancare (Block 2). schnappen = acchiappare (colloquiale). ertappen = cogliere sul fatto."},"frasi":[["Ho preso il treno per un pelo.","Ich habe den Zug noch erwischt."],["Ho acchiappato l'ultimo autobus.","Ich habe den letzten Bus erwischt."],["Hanno beccato il ladro.","Sie haben den Dieb erwischt."],["La prof l'ha beccato a copiare.","Die Lehrerin hat ihn beim Spicken erwischt."],["È toccata anche a me: raffreddore.","Mich hat es auch erwischt: Erkältung."],["Riesci a prendere il treno presto?","Erwischst du die frühe Bahn?"],["L'hanno beccato mentre sgranocchiava di nascosto.","Er wurde erwischt, wie er heimlich naschte."],["Con un tempo così ci si ammala in fretta.","So ein Wetter — da erwischt es einen schnell."],["Ho preso giusto in tempo l'ultimo posto.","Ich habe gerade noch einen Platz erwischt."],["Beccato! Quella scusa non reggeva.","Erwischt! Das war keine gute Ausrede."]]},{"de":"draufkommen","gloss":"arrivarci, capirci","spiega":{"parti":[["drauf","su di esso, sopra"],["kommen","venire, arrivare"]],"letterale":"Arrivarci sopra: la soluzione era lì e a un certo punto ci sali sopra con la mente. Tutto colloquiale.","immagine":"La lampadina che si accende: dopo mezz'ora a fissare il nulla, plopp, drauf gekommen.","grammatica":"Separabile, Perfekt con sein: ich bin draufgekommen. Spesso negativo: nicht draufkommen = non riuscire a ricordarlo o capirlo.","parenti":"herausfinden = scoprire (più neutro). der Einfall = l'idea improvvisa. Wie kommst du darauf? = come ti viene in mente?"},"frasi":[["Adesso non ci arrivo.","Jetzt komme ich nicht drauf."],["Non mi viene proprio il nome.","Ich komme einfach nicht auf den Namen drauf."],["Come ci sei arrivato?","Wie bist du da draufgekommen?"],["Finalmente ci sono arrivato!","Endlich bin ich draufgekommen!"],["Dai, ci arrivi subito.","Komm, du kommst gleich drauf."],["Lei ci è arrivata subito alla soluzione.","Sie ist sofort auf die Lösung gekommen."],["Ma come ti viene in mente?","Wie kommst du denn darauf?"],["Solo dopo ho capito cosa intendeva.","Erst später bin ich draufgekommen, was er meinte."],["A un'idea così bisogna prima arrivarci.","Auf so eine Idee muss man erst mal kommen."],["Ero lì lì per arrivarci.","Ich war kurz davor, draufzukommen."]]},{"de":"auf jeden Fall","gloss":"in ogni caso, assolutamente","spiega":{"parti":[["auf","su"],["jeden","ogni"],["Fall","caso (da der Fall = caso, e anche caduta)"]],"letterale":"Su ogni caso: qualunque cosa succeda, vale. È la conferma che non teme imprevisti.","immagine":"Il piano che regge comunque vada: qualunque dado esca dal bicchiere, auf jeden Fall.","grammatica":"Locuzione fissa, invariabile. Come risposta secca = assolutamente sì. Il contrario è auf keinen Fall = assolutamente no.","parenti":"der Fall = il caso. auf keinen Fall = mai e poi mai. jedenfalls = comunque, in ogni modo (parente in una parola sola)."},"frasi":[["Assolutamente sì!","Auf jeden Fall!"],["Vengo di sicuro.","Ich komme auf jeden Fall."],["Lo facciamo assolutamente.","Das machen wir auf jeden Fall."],["In ogni caso mi faccio sentire.","Auf jeden Fall melde ich mich."],["Non me lo perdo per niente al mondo.","Auf keinen Fall verpasse ich das."],["Porta assolutamente un ombrello.","Nimm auf jeden Fall einen Schirm mit."],["Vieni? — Assolutamente.","Kommst du? — Auf jeden Fall."],["Questo dobbiamo assolutamente provarlo.","Das müssen wir auf jeden Fall ausprobieren."],["Assolutamente no, è troppo rischioso per me.","Auf keinen Fall, das ist mir zu riskant."],["In ogni caso meglio di niente.","Auf jeden Fall besser als nichts."]]},{"de":"gar","gloss":"affatto (rafforza la negazione)","spiega":{"parti":[["gar","del tutto, completamente (uso antico: pronto, cotto)"]],"letterale":"Porta la negazione fino allo zero assoluto: gar nicht = per niente, gar kein = nessunissimo, gar nichts = proprio nulla. In cucina gar = cotto a puntino, stessa parola, altra vita.","immagine":"L'ago della radio che cala fino allo zero netto: non poco, gar nichts.","grammatica":"Si mette davanti a nicht / kein / nichts / niemand per intensificarli. gar nicht ha lo stesso valore di überhaupt nicht.","parenti":"überhaupt = affatto, ma anche in generale / addirittura. ganz und gar nicht = assolutamente per niente. Attenzione a sogar = persino, tutt'altro significato."},"frasi":[["Non è affatto vero.","Das stimmt gar nicht."],["Non ho per niente tempo.","Ich habe gar keine Zeit."],["Non è rimasto proprio niente.","Da ist gar nichts mehr übrig."],["Non è affatto così semplice.","Das ist gar nicht so einfach."],["Non ha reagito per niente.","Er hat gar nicht reagiert."],["Non son uantità.","immagine":"Il cartello al luna park: mindestens 1,40 m per salire sulla giostra. Sotto, niente da fare.","grammatica":"Avverbio, accompagna quantità o tempo: mindestens drei, mindestens eine Stunde. Il contrario è höchstens = al massimo.","parenti":"wenigstens = almeno consolatorio (vedi sopra: l'una è numero, l'altra è cuore). höchstens = al massimo. zumindest = quantomeno."},"frasi":[["Ci vuole almeno un'ora.","Das dauert mindestens eine Stunde."],["Ci servono almeno tre persone.","Wir brauchen mindestens drei Leute."],["C'erano almeno cento ospiti.","Es waren mindestens hundert Gäste da."],["Il volo costa almeno 200 euro.","Der Flug kostet mindestens 200 Euro."],["Chiamami almeno una volta a settimana.","Ruf mich mindestens einmal pro Woche an."],["Pesa almeno dieci chili.","Das wiegt mindestens zehn Kilo."],["Mi servono almeno due caffè per svegliarmi.","Ich brauche mindestens zwei Kaffee, um wach zu werden."],["Aspettiamo già da almeno venti minuti.","Wir warten schon mindestens zwanzig Minuten."],["Questo lo rifai almeno altre due volte.","Das machst du mindestens noch zweimal."],["Manca almeno la metà.","Mindestens die Hälfte fehlt noch."]]}]},{"block":6,"chiavi":[{"de":"gern","gloss":"volentieri, mi piace fare","spiega":{"parti":[["gern / gerne","volentieri"]],"letterale":"Non è un verbo, è l'avverbio del piacere: lo agganci a un verbo e dici che quell'azione la fai con piacere. È il gradino base della scala gern → lieber → am liebsten.","immagine":"Il sì entusiasta con cui accetti un favore: lo faccio gern, cioè col sorriso, non per dovere.","grammatica":"Avverbio, di solito dopo il verbo: ich mache GERN Sport. gerne è identico, solo più morbido. Comparativo lieber, superlativo am liebsten.","parenti":"lieber = preferisco (comparativo). am liebsten = più di tutto. Gern geschehen = prego, di nulla."},"frasi":[["Faccio sport volentieri.","Ich mache gern Sport."],["Dopo pranzo bevo volentieri un caffè.","Nach dem Mittagessen trinke ich gern einen Kaffee."],["Lavori volentieri da casa?","Arbeitest du gern im Homeoffice?"],["Lo faccio volentieri, nessun problema.","Das mache ich gern, kein Problem."],["Vengo volentieri, ma solo se c'è il dolce.","Ich komme gern, aber nur wenn es Nachtisch gibt."],["Cucino volentieri il fine settimana.","Ich koche gern am Wochenende."],["Lei viaggia volentieri da sola.","Sie reist gern allein."],["Quella musica l'ascoltavo volentieri.","Diese Musik habe ich gern gehört."],["Mi aiuti volentieri o per dovere?","Hilfst du gern oder aus Pflicht?"],["Volentieri, di nulla.","Gern geschehen."]]},{"de":"lieber","gloss":"preferisco, piuttosto (am liebsten = più di tutto)","spiega":{"parti":[["lieb","caro"],["-er","comparativo"]],"letterale":"Il comparativo di gern: più volentieri, cioè preferisco. In tedesco la preferenza è quasi sempre questo, non un verbo a parte. Quando ti viene da cercare preferire, la risposta è lieber.","immagine":"La bilancia tra due opzioni che pende da un lato: quello che pesa di più è il tuo lieber.","grammatica":"Per confrontare: lieber X als Y (preferisco X a Y). Superlativo am liebsten. Per i desideri con würde: am liebsten würde ich...","parenti":"gern (base), am liebsten (massimo). hätte lieber = preferirei avere. vorziehen / präferieren = preferire formale, da riconoscere ma non indispensabili."},"frasi":[["Preferisco il tè al caffè.","Ich trinke lieber Tee als Kaffee."],["Stasera preferisco restare a casa.","Heute Abend bleibe ich lieber zu Hause."],["Preferisci camminare o prendere la metro?","Gehst du lieber zu Fuß oder nimmst du die U-Bahn?"],["Più di tutto resterei a letto.","Am liebsten würde ich im Bett bleiben."],["Preferisco chiedere prima che sbagliare dopo.","Ich frage lieber vorher, als später falsch zu liegen."],["Oggi preferisco l'acqua al vino.","Heute trinke ich lieber Wasser als Wein."],["Lui preferisce lavorare la mattina.","Er arbeitet lieber am Morgen."],["Preferirei non rispondere adesso.","Ich würde lieber jetzt nicht antworten."],["Più di tutto mangerei sushi.","Am liebsten würde ich Sushi essen."],["Preferisco di no, grazie.","Lieber nicht, danke."]]},{"de":"mögen","gloss":"mi piace (gusti stabili, cose e persone)","spiega":{"parti":[["mögen","piacere, voler bene"]],"letterale":"Il piacere come gusto stabile: tu sei il soggetto e gradisci qualcosa. Ich mag X = a me piace X, e sei tu a fare l'azione del gradire.","immagine":"Il pollice in su che alzi tu: sei tu a dare l'ok, soggetto attivo. (gefallen è il contrario: è la cosa a farti l'occhiolino.)","grammatica":"Transitivo, accusativo: ich mag DEN Kaffee. Negazione: ich mag kein/keine. Forma cortese möchte = vorrei.","parenti":"gefallen = piacere come impressione, ma con struttura ribaltata (dativo). Per le persone: mögen = simpatia, gefallen = attrazione."},"frasi":[["Mi piace il caffè, ma non la sera.","Ich mag Kaffee, aber nicht am Abend."],["Non mi piacciono le riunioni lunghe.","Ich mag keine langen Meetings."],["Ti piace il tuo nuovo collega?","Magst du deinen neuen Kollegen?"],["Lei non ama il freddo.","Sie mag die Kälte nicht."],["Mi stai simpatico, ma i tuoi gusti musicali no.","Ich mag dich, aber deinen Musikgeschmack nicht."],["Mi piace questa città.","Ich mag diese Stadt."],["Non mi piace il rumore la mattina presto.","Ich mag keinen Lärm am frühen Morgen."],["Vi piace lavorare insieme?","Mögt ihr es, zusammen zu arbeiten?"],["Da bambino non amavo le verdure.","Als Kind mochte ich kein Gemüse."],["Vorrei un caffè, grazie.","Ich möchte einen Kaffee, danke."]]},{"de":"gefallen","gloss":"mi piace / mi è piaciuto (impressione, sempre con mir)","spiega":{"parti":[["ge-","prefisso"],["fallen","cadere"]],"letterale":"La cosa cade bene su di te: è lei il soggetto, tu finisci al dativo. Stessa identica logica dell'italiano mi piace: piace (la cosa) a me.","immagine":"La cosa che ti fa l'occhiolino: è lei ad agire su di te. Der Film gefällt MIR.","grammatica":"Soggetto = la cosa, persona al DATIVO (mir, dir, uns): Der Film gefällt mir. Presente = adesso; Perfekt hat mir gefallen = cosa già vista. gut e sehr entrambi ok, mai mich.","parenti":"mögen = piacere come gusto stabile (struttura opposta, accusativo). Attenzione persone: er gefällt mir = lo trovo attraente, non simpatico."},"frasi":[["Questo appartamento mi piace.","Diese Wohnung gefällt mir."],["Il film mi è piaciuto molto.","Der Film hat mir sehr gefallen."],["Come ti è piaciuta Berlino?","Wie hat dir Berlin gefallen?"],["La tua idea mi piace parecchio.","Deine Idee gefällt mir gut."],["Non mi è piaciuto per niente.","Das hat mir gar nicht gefallen."],["Questa canzone mi piace.","Dieses Lied gefällt mir."],["La presentazione è piaciuta al cliente.","Die Präsentation hat dem Kunden gefallen."],["Come vi è piaciuta la serata?","Wie hat euch der Abend gefallen?"],["Il nuovo ufficio non gli piace.","Das neue Büro gefällt ihm nicht."],["Mi piace come suona.","Mir gefällt, wie es klingt."]]}]}];

// ---------- storage sicuro (funziona offline; nel preview di Claude degrada senza errori)
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

// ---------- stato impostazioni
let cfg = Object.assign({pausa:10, ritmo:1.3, rate:0.9, vde:"", vit:""}, store.get("dd_cfg", {}));
let progress = store.get("dd_progress", {}); // { "b1-k0": {count, last} }

// ---------- voci
let voices = [];
function loadVoices(){
  if(!window.speechSynthesis) return;
  const list = speechSynthesis.getVoices();
  if(!list.length) return;
  voices = list;
  const pick = (lang, pref) => {
    const of = list.filter(v => v.lang && v.lang.toLowerCase().startsWith(lang));
    for(const n of pref){ const h = of.find(v => v.name.toLowerCase().includes(n)); if(h) return h.voiceURI; }
    return of.length ? of[0].voiceURI : "";
  };
  if(!cfg.vde || !list.find(v=>v.voiceURI===cfg.vde)) cfg.vde = pick("de", ["anna","petra","helena","markus"]);
  if(!cfg.vit || !list.find(v=>v.voiceURI===cfg.vit)) cfg.vit = pick("it", ["federica","alice","emma","luca"]);
  fillVoiceSelects();
}
function fillVoiceSelects(){
  const fill = (sel, lang, cur) => {
    sel.innerHTML = "";
    voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(lang)).forEach(v => {
      const o = document.createElement("option");
      o.value = v.voiceURI; o.textContent = v.name + " (" + v.lang + ")";
      if(v.voiceURI === cur) o.selected = true;
      sel.appendChild(o);
    });
  };
  fill(document.getElementById("selDE"), "de", cfg.vde);
  fill(document.getElementById("selIT"), "it", cfg.vit);
}
if(window.speechSynthesis){
  loadVoices();
  speechSynthesis.addEventListener("voiceschanged", loadVoices);
}

// ---------- home
function keyId(b, i){ return "b" + b + "-k" + i; }
function daysAgo(ts){ return Math.floor((Date.now() - ts) / 86400000); }
function renderHome(){
  const el = $("screen-home"); el.innerHTML = "";
  DATA.forEach(blk => {
    const t = document.createElement("div"); t.className = "blocktitle";
    t.innerHTML = '<span class="serif n">Block ' + blk.block + '</span><span class="c">' + blk.chiavi.length + ' chiavi</span>';
    el.appendChild(t);
    blk.chiavi.forEach((k, i) => {
      const p = progress[keyId(blk.block, i)];
      let badge = "";
      if(p && p.count){
        const d = daysAgo(p.last);
        badge = d >= 5 ? '<span class="badge rip">da ripassare · ' + d + 'g</span>'
                       : '<span class="badge">✓ ' + p.count + (d === 0 ? " · oggi" : " · " + d + "g fa") + '</span>';
      }
      const b = document.createElement("button"); b.className = "keyrow";
      b.innerHTML = '<span><span class="serif kde">' + k.de + '</span><div class="kit">' + k.gloss + '</div></span>' + badge;
      b.onclick = () => openPlayer(blk.block, i);
      el.appendChild(b);
    });
  });
}

// ---------- player / motore
let cur = null;        // {block, idx, key, steps}
let status = "idle";   // idle | playing | paused | done
let stepIdx = 0, runId = 0, timer = null, tick = null;

function buildSteps(k){
  const s = [];
  for(let r = 1; r <= 3; r++) s.push({lang:"de", text:k.de, label:"Chiave", base: r < 3 ? 2500 : 2000});
  s.push({lang:"it", text:k.gloss, label:"Significato", base:3000});
  k.frasi.forEach((f, i) => {
    s.push({lang:"it", text:f[0], label:"Frase " + (i+1) + " · italiano", countdown:true, frase:i});
    for(let r = 1; r <= 3; r++) s.push({lang:"de", text:f[1], label:"Frase " + (i+1) + " · tedesco " + r + "/3", base: r < 3 ? 4000 : 6000, frase:i});
  });
  return s;
}

function openPlayer(block, idx){
  const blk = DATA.find(b => b.block === block);
  cur = {block, idx, key: blk.chiavi[idx], steps: buildSteps(blk.chiavi[idx])};
  status = "idle"; stepIdx = 0;
  $("screen-home").style.display = "none";
  $("screen-player").style.display = "flex";
  $("btnBack").style.display = "inline-block";
  $("hEyebrow").textContent = "Block " + block + " · " + cur.key.frasi.length + " microvariazioni";
  $("hTitle").textContent = cur.key.de;
  $("hSub").textContent = cur.key.gloss;
  $("idleKey").textContent = cur.key.de;
  $("idleGloss").textContent = cur.key.gloss;
  $("idleFlag").textContent = "Frase italiana → " + cfg.pausa + " secondi per tradurla a mente → tedesco ripetuto 3 volte.";
  renderDots(); renderState();
}
function goHome(){
  stopAll(); releaseWake(); cur = null;
  $("screen-player").style.display = "none";
  $("screen-home").style.display = "block";
  $("btnBack").style.display = "none"; $("btnRestartTop").style.display = "none";
  $("hEyebrow").textContent = "Deutsch Drill";
  $("hTitle").textContent = "I tuoi blocchi";
  $("hSub").textContent = "Scegli una chiave e parti";
  renderHome();
}
$("btnBack").onclick = goHome;

// ---------- Wake Lock: tiene sveglio lo schermo durante il drill.
// Su iPhone-come-Web-App il supporto e' ballerino: se non c'e', si degrada in silenzio.
let wakeLock = null;
async function acquireWake(){
  try {
    if("wakeLock" in navigator && navigator.wakeLock.request){
      wakeLock = await navigator.wakeLock.request("screen");
      wakeLock.addEventListener("release", () => { wakeLock = null; });
    }
  } catch(e){ wakeLock = null; }
}
function releaseWake(){
  try { if(wakeLock){ wakeLock.release(); wakeLock = null; } } catch(e){ wakeLock = null; }
}
// iOS rilascia il lock quando l'app va in background: lo riprende al ritorno se sta suonando
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "visible" && status === "playing") acquireWake();
});

function stopAll(){
  runId++; if(timer) clearTimeout(timer); if(tick) clearInterval(tick);
  timer = tick = null;
  if(window.speechSynthesis) speechSynthesis.cancel();
}

function runStep(i){
  const my = runId;
  if(i >= cur.steps.length){
    status = "done";
    releaseWake();
    const id = keyId(cur.block, cur.idx);
    const p = progress[id] || {count:0, last:0};
    p.count++; p.last = Date.now(); progress[id] = p;
    store.set("dd_progress", progress);
    renderState(); return;
  }
  stepIdx = i; renderState();
  const st = cur.steps[i];
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(st.text);
  const uri = st.lang === "de" ? cfg.vde : cfg.vit;
  const v = voices.find(x => x.voiceURI === uri);
  if(v) u.voice = v;
  u.lang = st.lang === "de" ? "de-DE" : "it-IT";
  u.rate = st.lang === "de" ? cfg.rate : 1.0;
  u.volume = st.lang === "it" ? 0.7 : 1.0;
  const next = () => {
    if(my !== runId) return;
    const ms = st.countdown ? cfg.pausa * 1000 : Math.round((st.base || 2000) * cfg.ritmo);
    if(st.countdown){
      $("pausebox").style.display = "block";
      const t0 = Date.now();
      tick = setInterval(() => {
        if(my !== runId) return;
        $("pfill").style.width = Math.max(0, 100 - (Date.now() - t0) / ms * 100) + "%";
      }, 100);
    }
    timer = setTimeout(() => {
      if(my !== runId) return;
      if(tick) clearInterval(tick);
      $("pausebox").style.display = "none"; $("pfill").style.width = "100%";
      runStep(i + 1);
    }, ms);
  };
  u.onend = next; u.onerror = next;
  setTimeout(() => { if(my === runId) speechSynthesis.speak(u); }, 150);
}

function start(from){
  stopAll(); status = "playing"; acquireWake(); runStep(from);
}
function pause(){
  stopAll(); status = "paused"; releaseWake();
  $("pausebox").style.display = "none"; $("pfill").style.width = "100%";
  renderState();
}

// ---------- render
function renderDots(){
  const d = $("dots"); d.innerHTML = "";
  cur.key.frasi.forEach(() => { const s = document.createElement("div"); s.className = "dot"; d.appendChild(s); });
}
function renderState(){
  const st = cur ? cur.steps[Math.min(stepIdx, cur.steps.length - 1)] : null;
  $("idleBox").style.display = status === "idle" ? "flex" : "none";
  $("playBox").style.display = (status === "playing" || status === "paused") ? "flex" : "none";
  $("doneBox").style.display = status === "done" ? "flex" : "none";
  $("btnRestartTop").style.display = status === "idle" ? "none" : "inline-block";
  if(st && (status === "playing" || status === "paused")){
    $("stepLabel").textContent = st.label + (status === "paused" ? " · in pausa" : "");
    $("stepLabel").style.color = st.lang === "de" ? "var(--gold)" : "var(--muted)";
    const t = $("stepText"); t.textContent = st.text;
    t.className = "serif" + (st.text.length > 38 ? " small" : "");
    t.style.color = st.lang === "de" ? "var(--paper)" : "var(--itcol)";
  }
  // dots
  const fr = st && st.frase != null ? st.frase : -1;
  [...$("dots").children].forEach((d, i) => {
    d.className = "dot" + (status === "done" || i < fr ? " done" : i === fr ? " cur" : "");
  });
  // controls
  const c = $("controls"); c.innerHTML = "";
  const mk = (txt, cls, fn) => { const b = document.createElement("button"); b.className = "pill " + cls; b.textContent = txt; b.onclick = fn; c.appendChild(b); };
  if(status === "idle"){ mk("Inizia il drill", "gold", () => start(0)); mk("Spiegami", "goldline", openOverlay); }
  if(status === "playing"){ mk("Pausa", "goldline", pause); mk("Spiegami", "goldline", openOverlay); }
  if(status === "paused"){ mk("Riprendi", "gold", () => start(stepIdx)); mk("Spiegami", "goldline", openOverlay); }
  if(status === "done"){ mk("Riascolta", "gold", () => start(0)); mk("Spiegami", "goldline", openOverlay); mk("Blocchi", "dim", goHome); }
}
$("btnRestartTop").onclick = () => start(0);
$("skipbtn").onclick = () => { if(status !== "playing") return; const i = stepIdx; stopAll(); status = "playing"; $("pausebox").style.display = "none"; runStep(i + 1); };

// ---------- overlay spiegazione
let wasPlaying = false;
function openOverlay(){
  if(!cur) return;
  wasPlaying = status === "playing";
  if(wasPlaying) pause();
  const sp = cur.key.spiega;
  $("oParts").innerHTML = sp.parti.map(p => p[0]).join(' <span class="plus">+</span> ');
  $("oPlines").innerHTML = sp.parti.map(p => '<div class="pline"><b>' + p[0] + '</b> <span>→ ' + p[1] + '</span></div>').join("");
  $("oLett").textContent = sp.letterale;
  $("oImm").textContent = sp.immagine;
  $("oGram").textContent = sp.grammatica;
  $("oPar").textContent = sp.parenti;
  $("btnCloseOverlay").textContent = wasPlaying ? "Chiudi e riprendi" : "Chiudi";
  $("overlay").style.display = "flex";
}
$("btnCloseOverlay").onclick = () => {
  $("overlay").style.display = "none";
  if(wasPlaying) start(stepIdx);
};

// ---------- avvio
if(!window.speechSynthesis){
  $("screen-home").innerHTML = '<p style="margin-top:30px;color:var(--muted);">Questo browser non supporta la sintesi vocale. Apri la pagina con Safari.</p>';
} else {
  renderHome();
}

// ---------- service worker (solo se ospitata online, ignora errori altrove)
if("serviceWorker" in navigator && location.protocol === "https:"){
  navigator.serviceWorker.register("./sw.js").catch(() => {});
}
</script>
